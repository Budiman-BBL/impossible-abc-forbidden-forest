name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - run: npm ci
      - name: Build web (2D only; the 3D PoC has its own APK)
        run: ABC_TARGET=2d npm run build
      - name: Copy web build into the Android project
        run: npx cap sync android
      - name: Decode signing keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          fi
      - name: Build signed release APK
        if: steps.keystore.outputs.path != ''
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/ImpossibleABC.apk"
      - name: Build debug APK (no signing secrets available)
        if: steps.keystore.outputs.path == ''
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/ImpossibleABC.apk"
      - name: Name the APK
        id: name
        run: |
          VERSION=$(node -p "require('./package.json').version")
          FILE="ImpossibleABC-v${VERSION}-${GITHUB_SHA::7}.apk"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then FILE="ImpossibleABC-${GITHUB_REF_NAME}.apk"; fi
          mv "$RUNNER_TEMP/ImpossibleABC.apk" "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          ls -la "$FILE"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.name.outputs.file }}
          path: ${{ steps.name.outputs.file }}
          retention-days: 30
      - name: Publish GitHub Release (tags only)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.name.outputs.file }}" \
            --title "Impossible ABC $GITHUB_REF_NAME (Android APK)" \
            --notes-file docs/release-notes/$GITHUB_REF_NAME.md \
            || gh release upload "$GITHUB_REF_NAME" "${{ steps.name.outputs.file }}" --clobber
